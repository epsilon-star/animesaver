<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shine Hover Button</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f3f3f3;
      margin: 0;
    }

    .button {
      position: relative;
      display: inline-block;
      padding: 10px 30px;
      font-size: 18px;
      color: white;
      background-color: #e63946;
      border: 2px solid white;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    .button:hover {
      background-color: #d62839;
    }

    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
      transform: skewX(-25deg);
      transition: all 0.4s;
    }

    .button:hover::before {
      left: 100%;
      transition: all 0.4s;
    }

    .button span {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="button">
    <span>Hover</span>
  </div>
</body>
</html>
